[project]
name = "financial-data-sdk"
dynamic = ["version"]
description = "A Python SDK for the demo financial data API: data available at a cutoff, resumable pages, and the change stream."
readme = "README.md"
# Source available under a custom license, not open source.
license = "LicenseRef-NSPUL-1.0"
license-files = ["LICENSE"]
authors = [{ name = "Nathan Slaughter" }]
requires-python = ">=3.11"
# httpx is the only runtime dependency (D1). Its types are part of the public
# API, so the range stays below its next major version.
dependencies = ["httpx>=0.27,<1"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.optional-dependencies]
pandas = ["pandas>=2.2"]

[project.urls]
Repository = "https://github.com/nslaughter/financial-data-sdk-python"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.1",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/financial_data/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_data"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "scripts"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
